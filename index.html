<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruhaan's Car Collection</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#2a313c;--text:#e6edf3;--muted:#8b949e;--orange:#ff6a00;--yellow:#ffc400;--blue:#1e6bff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{padding:32px 20px 24px;text-align:center;background:linear-gradient(135deg,#ff3d00 0%,#ff8a00 45%,#ffc400 100%);color:#111;position:relative;overflow:hidden}
header:after{content:"";position:absolute;inset:auto 0 0 0;height:8px;background:repeating-linear-gradient(90deg,#111 0 20px,#fff 20px 40px)}
header h1{margin:0;font-size:clamp(28px,5vw,48px);font-weight:900;font-style:italic;letter-spacing:-1px;text-transform:uppercase}
header p{margin:6px 0 0;font-weight:600;opacity:.8}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:22px auto 0;max-width:900px}
.stat{background:rgba(0,0,0,.82);color:#fff;border-radius:12px;padding:10px 18px;min-width:110px}
.stat b{display:block;font-size:26px;color:var(--yellow)}
.stat span{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#ccc}
.controls{position:sticky;top:0;z-index:5;background:rgba(13,17,23,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:var(--orange);border-color:var(--orange);color:#111}
.chip small{opacity:.7;margin-left:4px}
input,select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:8px;font-size:14px}
input{min-width:200px}
main{max-width:1400px;margin:0 auto;padding:20px}
.count{color:var(--muted);font-size:14px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(255,106,0,.25);border-color:var(--orange)}
.card .ph{aspect-ratio:4/3;background:#222 center/cover no-repeat}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .info{padding:12px 14px 14px}
.card h3{margin:0 0 6px;font-size:15px;line-height:1.25;text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{white-space:nowrap;font-size:11px;font-weight:800;letter-spacing:.5px;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.stars{color:var(--yellow);font-size:15px;letter-spacing:1px;white-space:nowrap}
.stars i{color:#3a414c;font-style:normal}
.num{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.qty{position:absolute;top:10px;right:10px;background:var(--blue);color:#fff;font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px}
.empty{text-align:center;color:var(--muted);padding:60px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:10;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.lb.open{display:flex}
.lb img{max-width:min(1200px,94vw);max-height:76vh;border-radius:10px;box-shadow:0 10px 40px #000}
.lb .cap{margin-top:16px;text-align:center}
.lb .cap h2{margin:0 0 8px;text-transform:uppercase}
.lb .cap .row{justify-content:center;gap:10px 14px;flex-wrap:wrap}
.lb button{position:absolute;background:rgba(255,255,255,.1);border:0;color:#fff;font-size:30px;width:52px;height:52px;border-radius:50%;cursor:pointer}
.lb button:hover{background:var(--orange);color:#111}
.lb .x{top:18px;right:18px;font-size:26px}
.lb .prev{left:18px;top:50%;transform:translateY(-50%)}
.lb .next{right:18px;top:50%;transform:translateY(-50%)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:30px}
@media(max-width:600px){.lb .prev,.lb .next{top:auto;bottom:18px;transform:none}input{min-width:0;flex:1 1 100%}}
</style>
</head>
<body>
<header>
  <h1>Ruhaan's Car Collection</h1>
  <p>Die-cast garage &middot; rated by the collector</p>
  <div class="stats" id="stats"></div>
</header>
<div class="controls">
  <div class="chips" id="brands"></div>
  <div class="chips" id="ratings"></div>
  <input id="q" type="search" placeholder="Search cars...">
  <select id="sort">
    <option value="id">Collection order</option>
    <option value="rating">Rating (high to low)</option>
    <option value="name">Name (A-Z)</option>
    <option value="brand">Brand</option>
  </select>
</div>
<main>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</main>
<div class="lb" id="lb">
  <button class="x" aria-label="Close">&times;</button>
  <button class="prev" aria-label="Previous">&#8249;</button>
  <img id="lbimg" alt="">
  <div class="cap" id="lbcap"></div>
  <button class="next" aria-label="Next">&#8250;</button>
</div>
<footer>Made with love for Ruhaan's garage</footer>
<script src="cars.js"></script>
<script>
const CARS=window.CARS;
const IMG=window.IMAGES||null;
const thumb=c=>IMG?IMG[c.code].t:`img/thumb/${c.code}.jpg`;
const full=c=>IMG?IMG[c.code].f:`img/full/${c.code}.jpg`;
const BRAND_COLORS={"HOT WHEELS":["#ff6a00","#111"],"MAJORETTE":["#ffd200","#111"],"TEAMSTERZ":["#1e6bff","#fff"],"DACTOY":["#2ecc71","#111"]};
const bc=b=>BRAND_COLORS[b]||["#888","#111"];
const stars=n=>"★".repeat(n)+"<i>"+"★".repeat(5-n)+"</i>";
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const badge=b=>`<span class="brand" style="background:${bc(b)[0]};color:${bc(b)[1]}">${esc(b)}</span>`;
const state={brand:"ALL",rating:0,q:"",sort:"id"};
let view=[],cur=-1;

const total=CARS.reduce((s,c)=>s+c.qty,0);
const brands=[...new Set(CARS.map(c=>c.brand))];
const avg=(CARS.reduce((s,c)=>s+c.rating,0)/CARS.length).toFixed(1);
const fives=CARS.filter(c=>c.rating===5).length;
document.getElementById("stats").innerHTML=[[total,"Cars"],[CARS.length,"Models"],[brands.length,"Brands"],[avg+"★","Avg rating"],[fives,"5-star cars"]]
  .map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

const brandCounts=b=>CARS.filter(c=>b==="ALL"||c.brand===b).length;
document.getElementById("brands").innerHTML=["ALL",...brands].map(b=>`<button class="chip${b==="ALL"?" on":""}" data-b="${esc(b)}">${b==="ALL"?"All brands":esc(b)}<small>${brandCounts(b)}</small></button>`).join("");
document.getElementById("ratings").innerHTML=[0,5,4,3].map(r=>`<button class="chip${r===0?" on":""}" data-r="${r}">${r===0?"Any rating":r===5?"★5":"★"+r+"+"}</button>`).join("");

document.getElementById("brands").onclick=e=>{const b=e.target.closest("[data-b]");if(!b)return;state.brand=b.dataset.b;setOn("brands",b);render()};
document.getElementById("ratings").onclick=e=>{const b=e.target.closest("[data-r]");if(!b)return;state.rating=+b.dataset.r;setOn("ratings",b);render()};
document.getElementById("q").oninput=e=>{state.q=e.target.value.trim().toLowerCase();render()};
document.getElementById("sort").onchange=e=>{state.sort=e.target.value;render()};
function setOn(id,el){document.querySelectorAll(`#${id} .chip`).forEach(c=>c.classList.toggle("on",c===el))}

function render(){
  view=CARS.filter(c=>(state.brand==="ALL"||c.brand===state.brand)&&c.rating>=state.rating&&(!state.q||(c.model+" "+c.brand).toLowerCase().includes(state.q)));
  const s=state.sort;
  view.sort((a,b)=>s==="rating"?b.rating-a.rating||a.id-b.id:s==="name"?a.model.localeCompare(b.model):s==="brand"?a.brand.localeCompare(b.brand)||a.id-b.id:a.id-b.id);
  document.getElementById("count").textContent=`Showing ${view.length} of ${CARS.length} models`;
  document.getElementById("grid").innerHTML=view.length?view.map((c,i)=>`
    <div class="card" data-i="${i}">
      <span class="num">#${c.id}</span>${c.qty>1?`<span class="qty">×${c.qty}</span>`:""}
      <div class="ph"><img loading="lazy" src="${thumb(c)}" alt="${esc(c.model)}"></div>
      <div class="info"><h3>${esc(c.model)}</h3><div class="row">${badge(c.brand)}<span class="stars">${stars(c.rating)}</span></div></div>
    </div>`).join(""):`<div class="empty">No cars match. Try another filter.</div>`;
}
document.getElementById("grid").onclick=e=>{const c=e.target.closest(".card");if(c)open(+c.dataset.i)};

const lb=document.getElementById("lb");
function open(i){cur=(i+view.length)%view.length;const c=view[cur];
  document.getElementById("lbimg").src=full(c);document.getElementById("lbimg").alt=c.model;
  document.getElementById("lbcap").innerHTML=`<h2>${esc(c.model)}</h2><div class="row">${badge(c.brand)}<span class="stars">${stars(c.rating)}</span>${c.qty>1?`<span>×${c.qty} in collection</span>`:""}<span style="color:var(--muted)">#${c.id} · ${cur+1}/${view.length}</span></div>`;
  lb.classList.add("open")}
function close(){lb.classList.remove("open")}
lb.querySelector(".x").onclick=close;
lb.querySelector(".prev").onclick=()=>open(cur-1);
lb.querySelector(".next").onclick=()=>open(cur+1);
lb.onclick=e=>{if(e.target===lb)close()};
document.onkeydown=e=>{if(!lb.classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")open(cur-1);if(e.key==="ArrowRight")open(cur+1)};
let tx=null;lb.addEventListener("touchstart",e=>tx=e.touches[0].clientX);
lb.addEventListener("touchend",e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)open(cur+(d<0?1:-1));tx=null});
render();
</script>
</body>
</html>
